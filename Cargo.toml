[workspace]
members = [
    "agent/crates/core",
    "agent/crates/storage",
    "agent/crates/dns",
    "agent/crates/windows",
    "agent/crates/service",
    "agent/crates/session",
    "agent/crates/local_admin",
    "agent/crates/sync",
    "agent/crates/updater",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FamShield Team"]
license = "Proprietary"

[workspace.dependencies]
# Serialization & Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
arc-swap = "1.7"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database & Cryptography
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"

# Internal crates
famshield-core = { path = "agent/crates/core" }
famshield-storage = { path = "agent/crates/storage" }
famshield-dns = { path = "agent/crates/dns" }
famshield-windows = { path = "agent/crates/windows" }
famshield-session = { path = "agent/crates/session" }
famshield-local-admin = { path = "agent/crates/local_admin" }
