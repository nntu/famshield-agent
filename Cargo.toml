[workspace]
members = [
    "agent/crates/core",
    "agent/crates/storage",
    "agent/crates/dns",
    "agent/crates/windows",
    "agent/crates/service",
    "agent/crates/session",
    "agent/crates/local_admin",
    "agent/crates/sync",
    "agent/crates/updater",
]
resolver = "2"

[workspace.package]
version = "1.0.4"
edition = "2021"
authors = ["Nguyen Ngoc Tu <ngoctuct@gmail.com>", "FamShield Team"]
license = "MIT"
repository = "https://github.com/nntu/famshield-agent"
homepage = "https://github.com/nntu/famshield-agent"

[workspace.dependencies]
# Serialization & Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
aho-corasick = "1.1"

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
async-nats = "0.51"
futures-util = "0.3"
arc-swap = "1.9"
thiserror = "2.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
hickory-proto = "0.26"

# HTTP API & Middleware (Local Admin)
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Database & Cryptography
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
refinery = { version = "0.10", features = ["rusqlite"] }
argon2 = "0.5"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
totp-rs = { version = "6.0", features = ["gen_secret", "qr"] }

# Windows & System Ecosystem
windows = "0.58"
windows-service = "0.8"
tray-icon = "0.26"
muda = "0.21"
semver = "1.0"
jpeg-encoder = "0.7"
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "network"] }

# Internal crates
famshield-core = { path = "agent/crates/core" }
famshield-storage = { path = "agent/crates/storage" }
famshield-dns = { path = "agent/crates/dns" }
famshield-windows = { path = "agent/crates/windows" }
famshield-session = { path = "agent/crates/session" }
famshield-local-admin = { path = "agent/crates/local_admin" }
famshield-service = { path = "agent/crates/service" }
famshield-sync = { path = "agent/crates/sync" }
famshield-updater = { path = "agent/crates/updater" }

# ------------------------------------------------------------------------------
# Build Profiles Optimization for Fast Local Testing & CI
# ------------------------------------------------------------------------------
[profile.dev]
# Accelerate incremental builds on Windows
split-debuginfo = "unpacked"

[profile.test]
# Debug level 1 (line tables only): preserves file/line info for panic stack traces
# while reducing PDB size by ~70% and drastically speeding up MSVC link.exe
debug = 1

# Optimize external dependencies in tests (Argon2, SHA2, SQLite, Tokio, etc.)
# Keeps local crates unoptimized (instant compilation) while crypto/hashing runs 10x-50x faster
[profile.test.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

