[package]
name = "famshield-local-admin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Local Mode administration API and Master PIN authentication"

[dependencies]
famshield-core = { workspace = true }
famshield-storage = { workspace = true }
famshield-dns = { workspace = true }
famshield-windows = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
totp-rs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
