[package]
name = "famshield-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LocalSystem privileged Windows Service for FamShield"

[dependencies]
famshield-core = { workspace = true }
famshield-storage = { workspace = true }
famshield-dns = { workspace = true }
famshield-windows = { workspace = true }
famshield-local-admin = { workspace = true }
famshield-sync = { workspace = true }
famshield-updater = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Services",
] }
