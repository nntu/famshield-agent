services:
  # Lightweight, high-throughput Event Streaming Engine (~20MB RAM, zero JVM)
  nats:
    image: nats:2.10-alpine
    container_name: famshield-nats
    restart: unless-stopped
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring dashboard
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data

  control-plane:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: famshield-control-plane
    restart: unless-stopped
    depends_on:
      - nats
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=info
      - NATS_URL=nats://nats:4222
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  nats-data:
