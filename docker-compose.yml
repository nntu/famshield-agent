services:
  # Lightweight, high-throughput Event Streaming Engine (~20MB RAM, zero JVM)
  nats:
    image: nats:2.10-alpine
    container_name: famshield-nats
    restart: unless-stopped
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring dashboard
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data

  control-plane:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: famshield-control-plane
    restart: unless-stopped
    depends_on:
      - nats
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=info
      - NATS_URL=nats://nats:4222
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-FamShieldBot}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Centralized Guardian Web Management Console (React 19 + Nginx)
  web-console:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: famshield-web-console
    restart: unless-stopped
    depends_on:
      - control-plane
    ports:
      - "3000:80"

volumes:
  nats-data:

